<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Pierre Papier Ciseaux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <section>
            <div class="choix">
              

                <h4>
                    Vous
                <span id="choix-utilisateur"></span>
                </h4>

                <h4>
                    <span id="nom-ordinateur">Ordinateur</span>
                    <span id="choix-ordinateur"></span>
               </h4>
            </div>
            <h4><span id="resultat"></span></h4>
            <div class="bouttons_choix_jeu">
                <button id="pierre">Pierre</button>
                <button id="papier">Papier</button>
                <button id="ciseaux">Ciseaux</button>

            </div>

            <div class="progression">
            <h3>Niveau <span id="niveau">1</span></h3>

            <p>🏆 Victoires : <span id="victoires">0</span></p>
            <p>💀 Défaites : <span id="defaites">0</span></p>
            <p>🤝 Égalités : <span id="egalites">0</span></p>
            <p>🔥 Série : <span id="serie">0</span></p>
            <p>⭐ XP : <span id="xp">0</span></p>



           </div>

           

        </section>

        <script src="index.js"></script>
</body>
</html>
